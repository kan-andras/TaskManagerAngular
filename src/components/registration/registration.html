<div class="col-lg-6 offset-lg-3">
<h3>Regisztráció</h3>

<div class="form-floating mb-3">
  <input type="text" class="form-control" id="floatingName" placeholder="Username" [(ngModel)]="user.name">
  <label for="floatingName">Username</label>
</div>

<div class="form-floating mb-3">
  <input type="email" class="form-control" id="floatingEmail" placeholder="name@example.com" [(ngModel)]="user.email">
  <label for="floatingEmail">Email address</label>
</div>

<div class="form-floating mb-3">
  <input type="password" class="form-control" id="floatingPassword" placeholder="Password" [(ngModel)]="user.password">
  <label for="floatingPassword">Password</label>
</div>

<div class="form-floating mb-3">
  <input type="password" class="form-control" id="floatingPasswordConfirm" placeholder="Password" [(ngModel)]="user.confirm">
  <label for="floatingPasswordConfirm">Password Confirm</label>
</div>

<button type="button" class="btn btn-primary" (click)="register()">Register</button>
</div>
