<div *ngIf="message" class="alert alert-{{message.type === 'error' ? 'danger' : message.type}} alert-dismissible fade show" role="alert">
  <strong>{{message.title}}</strong>
  <br>
  {{message.message}}
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
